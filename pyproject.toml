[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"
[project]
name = "data-qd-160"
version = "0.1.0"
description = "Exact formula balancing and limiting-reagent batch accounting"
requires-python = ">=3.11"
dependencies = []
[project.scripts]
reaction-batch = "reaction_batch.cli:main"
reaction-lots = "reaction_batch.cli:lots_main"
reaction-assay = "reaction_batch.cli:assay_main"
reaction-peaks = "reaction_batch.cli:peaks_main"
reaction-isotopes = "reaction_batch.cli:isotopes_main"
reaction-split = "reaction_batch.cli:split_main"
[tool.setuptools.packages.find]
where = ["src"]
